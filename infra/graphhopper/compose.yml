services:
  graphhopper:
    image: ${GH_IMAGE:-ai-bike-graphhopper:11.1}
    build:
      context: .
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:${GH_PORT:-8989}:8989"
    volumes:
      - type: bind
        source: ${GH_DATA_DIR:-./artifacts/regional}
        target: /data
    environment:
      GH_OSM_FILE: ${GH_OSM_FILE:-/data/input/israel-and-palestine-260929.osm.pbf}
      GH_MIN_NETWORK_SIZE: ${GH_MIN_NETWORK_SIZE:-200}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx2304m -XX:ActiveProcessorCount=2"
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8989/info"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 30m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
