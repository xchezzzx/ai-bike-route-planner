# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYCLING_LIVE_ADVISOR: ""

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"
        
    - name: Restore dependencies
      run: dotnet restore src/backend/CyclingRoutes.slnx
      
    - name: Build
      run: dotnet build src/backend/CyclingRoutes.slnx --configuration Release --no-restore
      
    - name: Test
      run: dotnet test src/backend/CyclingRoutes.slnx --configuration Release --no-build --verbosity normal

    - name: Verify no-key fixture isolation with synthetic credentials
      env:
        Ai__Gemini__ApiKey: synthetic-no-network-key
        Ai__Gemini__Model: synthetic-model
        Routing__OpenRouteService__ApiKey: synthetic-no-network-key
      run: dotnet test src/backend/CyclingRoutes.Tests.Integration --configuration Release --no-build --filter "FullyQualifiedName~MissingConfig_DoesNotPreventHealth|FullyQualifiedName~MissingKey_Returns503|FullyQualifiedName~UnavailableGeneration_ReturnsHonestProblem|FullyQualifiedName~AccessFactory_BlocksNamedProviderHttpClients" --verbosity minimal

    - name: Verify evaluation runner without provider calls
      shell: pwsh
      run: ./tools/tests/evaluate-prompts.tests.ps1

    - name: Verify refinement evaluation without provider calls
      shell: pwsh
      run: ./tools/tests/evaluate-refinement.tests.ps1

    - name: Verify geographic data importer offline
      shell: pwsh
      run: ./tools/tests/import-geonames.tests.ps1

    - name: Verify local routing launcher isolation
      shell: pwsh
      run: ./tools/test-local-routing.ps1

    - name: Build and smoke-test API container without keys
      shell: bash
      run: |
        set -euo pipefail
        docker build -f src/backend/CyclingRoutes.Api/Dockerfile -t cycling-routes-ci src/backend
        container=$(docker run --rm -d -p 127.0.0.1::8080 -e Access__Mode=Local cycling-routes-ci)
        trap 'docker stop "$container" >/dev/null' EXIT
        address=$(docker port "$container" 8080/tcp)
        base="http://$address"
        for attempt in {1..30}; do
          if curl --max-time 2 --fail --silent "$base/health" > /tmp/health; then break; fi
          sleep 1
        done
        test "$(cat /tmp/health)" = Healthy
        status=$(curl --max-time 10 --silent --show-error -o /tmp/interpret.json -w '%{http_code}' \
          -H 'Content-Type: application/json' \
          -d '{"prompt":"A road loop of 20 km","locale":"en"}' \
          "$base/api/route-intents/interpret")
        test "$status" = 503
        jq -e '.code == "ai_not_configured"' /tmp/interpret.json
        status=$(curl --max-time 10 --silent --show-error -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' -d '{' "$base/api/route-intents/interpret")
        test "$status" = 400

  graphhopper-smoke:
    name: Smoke local GraphHopper engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Import synthetic roads and verify engine restart
      shell: pwsh
      run: ./infra/graphhopper/tests/smoke.ps1

  protected-deployment:
    name: Smoke protected full-app container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Build and smoke-test without provider keys
      shell: pwsh
      run: ./tools/smoke-protected-deployment.ps1
