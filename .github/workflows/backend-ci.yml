# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-ci.yml"
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"
        
    - name: Restore dependencies
      run: dotnet restore src/backend/CyclingRoutes.slnx
      
    - name: Build
      run: dotnet build src/backend/CyclingRoutes.slnx --configuration Release --no-restore
      
    - name: Test
      run: dotnet test src/backend/CyclingRoutes.slnx --configuration Release --no-build --verbosity normal
